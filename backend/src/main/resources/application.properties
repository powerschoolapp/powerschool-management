
spring.application.name=powerschool-backend
server.port=${PORT:8080}

# Aiven MySQL database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Application settings
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500}

# Hide sensitive error details
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Initial administrator configuration
app.initial-admin.username=${APP_INITIAL_ADMIN_USERNAME:}
app.initial-admin.password=${APP_INITIAL_ADMIN_PASSWORD:}
app.initial-admin.full-name=${APP_INITIAL_ADMIN_FULL_NAME:}
app.initial-admin.email=${APP_INITIAL_ADMIN_EMAIL:}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# One-time development admin password reset
app.reset-admin-password=${APP_RESET_ADMIN_PASSWORD:false}